<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FFF8F0">
  <link rel="icon" href="data:,">
  <title>方舟動物上船 — 幼兒學習中心</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/preschool-hubs.css">
  <link rel="stylesheet" href="css/ark-k2.css">
</head>
<body>
  <div class="ark-app" id="arkApp">
    <header class="ark-header">
      <a class="ark-back" href="k2.html" aria-label="返回 K2 入口" data-localize-aria-label="backAria">← <span data-localize="backLink">K2 升小準備</span></a>
      <div class="ark-brand">
        <span class="ark-brand-icon" aria-hidden="true">🛶</span>
        <div>
          <p class="ark-eyebrow">K2 → 小一</p>
          <h1 data-localize="gameTitle">方舟動物上船</h1>
        </div>
      </div>
      <div class="ark-header-actions">
        <div class="ark-language" role="group" aria-label="語言">
          <button type="button" data-language="zhHK" aria-pressed="true">粵語</button>
          <button type="button" data-language="zhCN" aria-pressed="false">普通話</button>
        </div>
        <button class="ark-parent-tab" id="parentTab" type="button">家長成績表</button>
      </div>
    </header>

    <main>
      <section class="ark-screen" id="homeScreen" aria-labelledby="worldTitle">
        <div class="ark-world-card">
          <div class="ark-world-copy">
            <p class="ark-kicker" data-localize="homeKicker">一個世界 · 四級任務</p>
            <h2 id="worldTitle" data-localize="worldTitle">幫挪亞照顧方舟動物</h2>
            <p data-localize="worldDescription">聽動物、寫中文字、數羊和做加減。慢慢完成任務，為方舟收集星星。</p>
            <p class="ark-voice-note" id="voiceStatus" aria-live="polite"></p>
          </div>
          <div class="ark-world-art" aria-hidden="true">
            <img src="img/noah-icon.png" alt="">
          </div>
        </div>

        <button class="ark-story-entry" id="storyOpen" type="button">
          <span class="ark-story-entry-art" aria-hidden="true">📖</span>
          <span class="ark-story-entry-copy"><strong id="storyEntryTitle">故事：挪亞造方舟</strong><small id="storyReadCount">已讀 0／7 章</small></span>
          <span class="ark-story-entry-arrow" aria-hidden="true">›</span>
        </button>

        <section class="ark-level-section" aria-labelledby="levelsTitle">
          <div class="ark-section-heading">
            <div>
              <p class="ark-kicker" data-localize="levelKicker">逐級解鎖</p>
              <h2 id="levelsTitle" data-localize="selectTask">選擇任務</h2>
            </div>
            <span class="ark-total-stars" id="totalStars" aria-live="polite">☆ 0 / 12</span>
          </div>
          <div class="ark-level-grid" id="levelGrid"></div>
        </section>

        <p class="ark-privacy-note" data-localize="privacyNote">練習進度只保存在這個瀏覽器，不會記錄孩子姓名。</p>
      </section>

      <section class="ark-screen ark-story-screen" id="storyListScreen" hidden aria-labelledby="storyListTitle">
        <div class="ark-story-heading">
          <button class="ark-back-game" id="storyListBack" type="button">← 任務列表</button>
          <div><p class="ark-kicker">方舟故事</p><h2 id="storyListTitle">挪亞造方舟</h2></div>
          <span class="ark-story-count" id="storyListReadCount">已讀 0／7 章</span>
        </div>
        <div class="ark-story-list" id="storyChapterList"></div>
      </section>

      <section class="ark-screen ark-story-screen" id="storyReaderScreen" hidden aria-labelledby="storyChapterTitle">
        <div class="ark-story-heading">
          <button class="ark-back-game" id="storyReaderBack" type="button">← 故事列表</button>
          <div><p class="ark-kicker" id="storyChapterDate"></p><h2 id="storyChapterTitle"></h2></div>
          <button class="btn btn-secondary ark-story-list-button" id="storyReaderList" type="button">返任務列表</button>
        </div>
        <article class="ark-story-page">
          <img class="ark-story-image" id="storyChapterImage" src="" alt="">
          <div class="ark-story-reading">
            <p class="ark-story-text" id="storyChapterText"></p>
            <p class="ark-story-highlight-help" id="storyHighlightHelp"></p>
            <button class="btn btn-primary ark-story-audio" id="storyReadButton" type="button">🔊 朗讀</button>
          </div>
        </article>
        <div class="ark-story-actions">
          <button class="btn btn-secondary" id="storyPrev" type="button">上一章</button>
          <a class="btn btn-accent" id="storyCopybookLink" href="copybook.html">去練字</a>
          <button class="btn btn-secondary" id="storyNext" type="button">下一章</button>
        </div>
      </section>

      <section class="ark-screen" id="gameScreen" hidden aria-labelledby="levelTitle">
        <div class="ark-game-heading">
          <button class="ark-back-game" id="backToLevels" type="button" data-localize="backToLevels">← 任務列表</button>
          <div>
            <p class="ark-kicker" id="levelKicker"></p>
            <h2 id="levelTitle"></h2>
          <button class="ark-level-demo" id="levelDemo" type="button" hidden>示範</button>
          </div>
          <p class="ark-question-counter" id="questionCounter"></p>
        </div>
        <div class="ark-progress-track" aria-label="本輪主要題目進度"><span id="questionProgress"></span></div>
        <p class="ark-level-instruction" id="levelInstruction"></p>
        <p class="ark-game-voice-note" id="gameVoiceStatus" role="status" aria-live="polite" hidden></p>

        <div class="ark-play-card">
          <div class="ark-play-scene" id="playScene"></div>
          <p class="ark-feedback" id="feedback" role="status" aria-live="polite"></p>
          <div class="ark-play-actions" id="playActions"></div>
        </div>
      </section>

      <section class="ark-screen" id="parentScreen" hidden aria-labelledby="parentHeading">
        <div class="ark-parent-heading">
          <a class="ark-back-game ark-parent-back" href="k2.html" aria-label="返回 K2 入口">←</a>
          <div class="ark-parent-title">
            <p class="ark-kicker" data-localize="parentKicker">家校一起看</p>
            <h2 id="parentHeading" data-localize="parentHeading">家長成績表</h2>
            <p class="ark-parent-meta"><span data-localize="parentLastPractice">上次練習</span>：<span id="recentDateValue">—</span> · <span data-localize="parentLocalOnly">只存在這部機</span></p>
          </div>
          <div class="ark-language ark-parent-language" role="group" aria-label="語言">
            <button type="button" data-language="zhHK" aria-pressed="true">粵語</button>
            <button type="button" data-language="zhCN" aria-pressed="false">普通話</button>
          </div>
        </div>
        <p class="ark-parent-note" id="parentIntro"></p>

        <section class="ark-report-card" aria-labelledby="reportLevelsTitle">
          <h3 id="reportLevelsTitle" data-localize="reportLevels">各級星數與次數</h3>
          <div id="parentLevelScores" class="ark-parent-levels"></div>
        </section>

        <div class="ark-parent-content">
          <section class="ark-report-card" aria-labelledby="mistakesTitle">
            <h3 id="mistakesTitle" data-localize="weeklyPracticeHeading">今個星期可以陪佢練</h3>
            <p class="ark-review-rule" id="reviewRule"></p>
            <ul id="parentSuggestions" class="ark-suggestion-list"></ul>
            <p id="noMistakes" class="ark-empty-note" hidden></p>
          </section>
          <section class="ark-report-card" aria-labelledby="practiceTimeTitle">
            <h3 id="practiceTimeTitle" data-localize="practiceTimeHeading">最近 7 日練習（分鐘）</h3>
            <div id="practiceChart" class="ark-practice-chart" role="img"></div>
            <p class="ark-practice-note" id="practiceTimeNote"></p>
          </section>
        </div>
        <p class="ark-report-story-summary" id="parentStorySummary"></p>
        <button class="btn btn-danger ark-clear-progress" id="clearProgress" type="button">清除進度…</button>
      </section>

      <section class="ark-screen" id="resultScreen" hidden aria-labelledby="resultTitle">
        <div class="ark-result-heading">
          <p class="ark-kicker" id="resultKicker"></p>
          <h2 id="resultTitle"></h2>
          <p class="ark-result-score" id="resultScore"></p>
          <div class="ark-result-stars" id="resultStars" aria-label="本級星數"></div>
        </div>
        <div class="ark-result-grid">
          <section class="ark-result-animals-card" aria-labelledby="resultAnimalsHeading">
            <div class="ark-result-animals-heading">
              <h3 id="resultAnimalsHeading"></h3>
              <span class="ark-result-sticker-new" id="newStickerLabel" hidden>新！</span>
            </div>
            <div class="ark-result-animals" id="resultAnimals"></div>
            <p class="ark-process-praise" id="processPraise"></p>
          </section>
          <section class="ark-sticker-card" aria-labelledby="stickerBookHeading">
            <h3 id="stickerBookHeading" data-localize="stickerBook">我的貼紙簿</h3>
            <div class="ark-sticker-grid" id="stickerBook"></div>
            <p class="ark-sticker-note" data-localize="stickerNote">完成紀念，唔係分數。</p>
          </section>
        </div>
        <div class="ark-result-actions" id="resultActions"></div>
      </section>
    </main>
  </div>

  <script src="js/ark-k2-progress.js" defer></script>
  <script src="js/ark-k2-math.js" defer></script>
  <script src="js/ark-k2-strokes.js" defer></script>
  <script src="js/ark-k2.js" defer></script>
</body>
</html>
