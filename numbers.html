<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>數字認知 — 幼兒學習中心</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <style>
    /* Number cards grid */
    .num-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    @media (max-width: 480px) { .num-grid { grid-template-columns: repeat(3, 1fr); } }

    .num-card {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 8px 12px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      gap: 4px;
      min-height: 110px;
      justify-content: center;
    }
    .num-card:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 12px 28px rgba(0,0,0,0.14); }
    .num-big   { font-size: 2.2rem; font-weight: 900; color: var(--primary); line-height: 1; }
    .num-dots  { font-size: 0.75rem; letter-spacing: 1px; color: var(--secondary); min-height: 18px; word-break: break-all; text-align: center; }
    .num-zh    { font-size: 1rem; font-weight: 700; color: var(--text); }
    .num-en    { font-size: 0.72rem; color: #888; }

    /* Game areas */
    .game-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 8px 0;
    }
    .game-prompt {
      font-size: 1.1rem;
      font-weight: 700;
      color: #555;
      text-align: center;
    }
    .emoji-stage {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--card-shadow);
      padding: 20px;
      font-size: 2rem;
      text-align: center;
      min-width: 200px;
      min-height: 80px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
      line-height: 1;
    }
    .answer-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      width: 100%;
      max-width: 360px;
    }
    .ans-btn {
      padding: 0;
      height: 72px;
      border: 3px solid transparent;
      border-radius: var(--radius-sm);
      background: #fff;
      box-shadow: var(--card-shadow);
      font-family: var(--font);
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--text);
      cursor: pointer;
      transition: transform 0.15s, background 0.15s, border-color 0.15s;
    }
    .ans-btn:hover { transform: scale(1.06); border-color: var(--primary); }

    /* sequence game */
    .seq-row {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }
    .seq-num {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-sm);
      background: #fff;
      box-shadow: var(--card-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--primary);
    }
    .seq-blank {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-sm);
      border: 3px dashed var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: #ccc;
    }

    .score-display {
      font-size: 1rem;
      font-weight: 700;
      color: var(--secondary);
    }

    .focus-note {
      margin: -8px 0 18px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      background: #e8fff8;
      color: #008f73;
      font-size: 0.88rem;
      font-weight: 700;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="module-page">
    <header class="page-header">
      <a href="index.html" class="back-btn" aria-label="返回">←</a>
      <h1>🔢 數字認知</h1>
    </header>

    <div class="focus-note" id="focusNote" hidden></div>

    <div class="tab-bar">
      <button class="tab-btn active" data-tab="cards">📇 數字卡</button>
      <button class="tab-btn" data-tab="count">🎮 計數遊戲</button>
      <button class="tab-btn" data-tab="order">🔢 數序排列</button>
    </div>

    <!-- Tab: Number Cards -->
    <div id="tab-cards">
      <div class="num-grid" id="numGrid"></div>
    </div>

    <!-- Tab: Counting Game -->
    <div id="tab-count" style="display:none;">
      <div class="game-area">
        <div class="score-display" id="countScore">⭐ 分數: 0</div>
        <div class="game-prompt">數一數有幾個？</div>
        <div class="emoji-stage" id="emojiStage"></div>
        <div class="answer-grid" id="countAnswers"></div>
        <button class="btn btn-secondary" id="countNext">下一題 ▶</button>
      </div>
    </div>

    <!-- Tab: Order Game -->
    <div id="tab-order" style="display:none;">
      <div class="game-area">
        <div class="score-display" id="orderScore">⭐ 分數: 0</div>
        <div class="game-prompt">找出缺少的數字 🔍</div>
        <div class="seq-row" id="seqRow"></div>
        <div class="answer-grid" id="orderAnswers"></div>
        <button class="btn btn-secondary" id="orderNext">下一題 ▶</button>
      </div>
    </div>
  </div>

  <script src="js/core-voice-assets.js"></script>
  <script src="js/numbers.js"></script>
</body>
</html>
