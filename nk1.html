<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FFF8F0">
  <link rel="icon" href="data:,">
  <title>N / K1 幼兒啟蒙 — 幼兒學習中心</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/preschool-hubs.css">
</head>
<body>
  <div class="site-shell">
    <header class="site-header nk1-header">
      <a class="site-back" href="index.html" aria-label="返回首頁">‹</a>
      <div class="site-header-copy">
        <h1>N / K1 幼兒啟蒙</h1>
        <p class="site-subtitle">2–4 歲 · 聽、玩、認</p>
      </div>
      <button class="nk1-read-all" id="readAllNames" type="button" aria-label="讀出全部名稱" title="讀出全部名稱">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 010 6M19 6a8 8 0 010 12"/></svg>
      </button>
    </header>

    <main class="site-main nk1-main">
      <p class="nk1-status" id="nk1AudioStatus" role="status" aria-live="polite"></p>
      <section class="nk1-grid" aria-label="N / K1 幼兒啟蒙活動">
        <article class="nk1-card">
          <a class="nk1-card-link" href="alphabet/" aria-label="字母唱歌">
            <span class="nk1-card-visual"><img src="img/noah/animals/rabbit.jpg" alt="小兔插圖"><span class="nk1-music-note" aria-hidden="true">♫</span></span>
            <span class="nk1-label">字母唱歌</span>
          </a>
          <button class="nk1-card-sound" type="button" data-play-name="alphabet_song" aria-label="讀出：字母唱歌" title="讀出字母唱歌">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 010 6M19 6a8 8 0 010 12"/></svg>
          </button>
        </article>
        <article class="nk1-card">
          <a class="nk1-card-link" href="shapes.html" aria-label="形狀">
            <span class="nk1-card-visual">
              <svg viewBox="0 0 220 110" aria-hidden="true"><circle cx="40" cy="55" r="32" fill="#4ECDC4"/><rect x="91" y="23" width="64" height="64" rx="12" fill="#FFB347"/><path d="M185 20l34 68h-68z" fill="#FFE66D"/></svg>
            </span>
            <span class="nk1-label">形狀</span>
          </a>
          <button class="nk1-card-sound" type="button" data-play-name="shapes" aria-label="讀出：形狀" title="讀出形狀">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 010 6M19 6a8 8 0 010 12"/></svg>
          </button>
        </article>
        <article class="nk1-card">
          <a class="nk1-card-link" href="characters.html" aria-label="認圖認字">
            <span class="nk1-card-visual nk1-glyphs" aria-hidden="true"><span>日</span><span>月</span><span>水</span><span>火</span></span>
            <span class="nk1-label">認圖認字</span>
          </a>
          <button class="nk1-card-sound" type="button" data-play-name="recognize_picture_words" aria-label="讀出：認圖認字" title="讀出認圖認字">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 010 6M19 6a8 8 0 010 12"/></svg>
          </button>
        </article>
        <article class="nk1-card">
          <a class="nk1-card-link" href="numbers.html" aria-label="數一數">
            <span class="nk1-card-visual"><img src="img/noah/animals/elephant.jpg" alt="大象插圖"><span class="nk1-number-mark" aria-hidden="true">1 2 3</span></span>
            <span class="nk1-label">數一數</span>
          </a>
          <button class="nk1-card-sound" type="button" data-play-name="counting" aria-label="讀出：數一數" title="讀出數一數">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 010 6M19 6a8 8 0 010 12"/></svg>
          </button>
        </article>
        <article class="nk1-card nk1-card-wide">
          <a class="nk1-card-link" href="writing.html" aria-label="塗鴉畫畫">
            <span class="nk1-card-visual">
              <svg viewBox="0 0 160 120" fill="none" stroke-width="10" stroke-linecap="round" aria-hidden="true"><path d="M16 90c20-60 40-60 56-20s36 40 72-40" stroke="#4ECDC4"/><path d="M24 104c40-8 80-8 120 0" stroke="#FFB347"/></svg>
            </span>
            <span class="nk1-label">塗鴉畫畫</span>
          </a>
          <button class="nk1-card-sound" type="button" data-play-name="doodle_drawing" aria-label="讀出：塗鴉畫畫" title="讀出塗鴉畫畫">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 010 6M19 6a8 8 0 010 12"/></svg>
          </button>
        </article>
      </section>
      <a class="site-back nk1-return" href="index.html">返回首頁</a>
    </main>
  </div>
  <script src="js/nk1.js" defer></script>
</body>
</html>
