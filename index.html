<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FFF8F0">
  <link rel="icon" href="data:,">
  <title>幼兒學習中心</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/preschool-hubs.css">
</head>
<body>
  <div class="site-shell home-shell">
    <header class="site-header">
      <div class="site-header-copy">
        <h1>幼兒學習中心</h1>
        <p class="site-subtitle">請家長先揀小朋友的年級</p>
      </div>
      <a class="site-parent-link" href="ark-k2.html#parents" aria-label="打開方舟家長成績表">
        <span aria-hidden="true">▥</span> 家長成績表
      </a>
    </header>
    <main class="home-lanes">
      <a class="lane-card lane-card-k2" href="k2.html" data-level-link="k2" aria-label="進入 K2 升小準備">
        <span class="lane-last-choice" data-last-choice="k2">上次選擇</span>
        <span class="lane-art"><img src="img/noah-icon.png" alt="挪亞方舟插圖"></span>
        <span class="lane-copy">
          <span class="lane-title">K2 升小準備</span>
          <span class="lane-age">5–6 歲 · 跟學校進度</span>
        </span>
        <span class="lane-tags" aria-label="認字、寫字、數學、英文">
          <span>認字</span><span>寫字</span><span>數學</span><span>英文</span>
        </span>
      </a>
      <a class="lane-card lane-card-nk1" href="nk1.html" data-level-link="nk1" aria-label="進入 N / K1 幼兒啟蒙">
        <span class="lane-last-choice" data-last-choice="nk1">上次選擇</span>
        <span class="lane-art"><img src="img/noah/animals/sheep.jpg" alt="小羊插圖"></span>
        <span class="lane-copy">
          <span class="lane-title">N / K1 幼兒啟蒙</span>
          <span class="lane-age">2–4 歲 · 聽、玩、認</span>
        </span>
        <span class="lane-tags" aria-label="唱歌、形狀、塗鴉、認圖">
          <span>唱歌</span><span>形狀</span><span>塗鴉</span><span>認圖</span>
        </span>
      </a>
    </main>
    <p class="site-footer-note">進度只保存在這部機，不會上載，也不記名字</p>
  </div>
  <script src="js/preschool-home.js" defer></script>
</body>
</html>
