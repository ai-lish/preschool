<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>幼兒學習中心</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <style>
    body {
      background: linear-gradient(135deg, #f5f3ff 0%, #e8f8f5 50%, #fff9e6 100%);
      min-height: 100vh;
    }
    .home-wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 32px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }
    .home-header {
      text-align: center;
      margin-bottom: 8px;
    }
    .home-logo {
      font-size: 4rem;
      line-height: 1;
      margin-bottom: 8px;
      animation: pop 0.6s ease both;
    }
    .home-title {
      font-size: 2rem;
      font-weight: 900;
      color: var(--primary);
      margin-bottom: 4px;
    }
    .home-subtitle-en {
      font-size: 1.1rem;
      color: #666;
      margin-bottom: 6px;
    }
    .home-tagline {
      font-size: 0.95rem;
      color: var(--secondary);
      font-weight: 700;
      background: #e8f8f5;
      display: inline-block;
      padding: 6px 18px;
      border-radius: 50px;
      margin-top: 6px;
      margin-bottom: 28px;
    }
    .module-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      width: 100%;
    }
    .module-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 160px;
      border-radius: 24px;
      padding: 24px 16px 20px;
      text-decoration: none;
      color: #fff;
      box-shadow: 0 8px 28px rgba(0,0,0,0.13);
      transition: transform 0.18s, box-shadow 0.18s;
      gap: 8px;
    }
    .module-card:hover, .module-card:active {
      transform: translateY(-5px) scale(1.03);
      box-shadow: 0 16px 40px rgba(0,0,0,0.18);
    }
    .module-card .icon {
      font-size: 3rem;
      line-height: 1;
      margin-bottom: 4px;
    }
    .module-card .zh-title {
      font-size: 1.25rem;
      font-weight: 900;
      line-height: 1.2;
    }
    .module-card .en-title {
      font-size: 0.82rem;
      opacity: 0.88;
      font-weight: 700;
    }
    .card-writing    { background: linear-gradient(135deg, #6C5CE7, #a29bfe); }
    .card-numbers    { background: linear-gradient(135deg, #00B894, #55efc4); color: #1a5c4e; }
    .card-shapes     { background: linear-gradient(135deg, #FDCB6E, #f9ca24); color: #7d5a00; }
    .card-characters { background: linear-gradient(135deg, #fd79a8, #e84393); }
    .card-numbers .en-title, .card-shapes .en-title { opacity: 0.75; }

    .footer-note {
      margin-top: 32px;
      font-size: 0.8rem;
      color: #aaa;
      text-align: center;
    }

    @media (max-width: 400px) {
      .module-card { min-height: 130px; padding: 18px 10px 14px; }
      .module-card .icon { font-size: 2.4rem; }
      .module-card .zh-title { font-size: 1.05rem; }
      .home-title { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="home-wrap">
    <header class="home-header">
      <div class="home-logo">🎓</div>
      <h1 class="home-title">幼兒學習中心</h1>
      <p class="home-subtitle-en">Preschool Learning Center</p>
      <p class="home-tagline">「讓小朋友透過遊戲自然學習」</p>
    </header>

    <nav class="module-grid" aria-label="學習模組">
      <a href="writing.html" class="module-card card-writing" aria-label="寫字練習">
        <div class="icon">✏️</div>
        <div class="zh-title">寫字練習</div>
        <div class="en-title">Writing Practice</div>
      </a>
      <a href="numbers.html" class="module-card card-numbers" aria-label="數字認知">
        <div class="icon">🔢</div>
        <div class="zh-title">數字認知</div>
        <div class="en-title">Number Fun</div>
      </a>
      <a href="shapes.html" class="module-card card-shapes" aria-label="圖形形狀">
        <div class="icon">⬛</div>
        <div class="zh-title">圖形形狀</div>
        <div class="en-title">Shapes</div>
      </a>
      <a href="characters.html" class="module-card card-characters" aria-label="字符認識">
        <div class="icon">字</div>
        <div class="zh-title">字符認識</div>
        <div class="en-title">Characters</div>
      </a>
    </nav>

    <p class="footer-note">適合 3–4 歲小朋友 · For ages 3–4</p>
  </div>
</body>
</html>
